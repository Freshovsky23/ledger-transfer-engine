apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-app-deployment
  labels:
    app: ledger-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-app
  template:
    metadata:
      labels:
        app: ledger-app
    spec:
      containers:
        - name: ledger-app
          image: fintech-ledger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5